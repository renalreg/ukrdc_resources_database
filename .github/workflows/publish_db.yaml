name: Build and publish UKRDC database

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start database container
        run: |
          docker compose up -d --build
          echo "Waiting for database initialization..."
          timeout 300 bash -c 'until docker compose logs postgres 2>&1 | grep -q "Sync complete"; do sleep 5; done'
          echo "Database ready"
          docker compose logs postgres

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push image
        run: |
          docker commit ukrdc-postgres-build ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Dump database
        run: |
          docker compose exec -T postgres pg_dump -U postgres -d UKRDC -Fc > ukrdc_database.dump

      - name: Attach dump to release
        uses: softprops/action-gh-release@v2
        with:
          files: ukrdc_database.dump

      - name: Stop container
        run: docker compose down
