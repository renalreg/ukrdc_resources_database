name: Build and publish UKRDC database

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Start database container
        run: |
          docker compose up -d
          docker compose exec -T postgres bash -c '
            until pg_isready -U postgres -d UKRDC; do
              echo "Waiting for database to be ready..."
              sleep 2
            done
          '

      - name: Create PostgreSQL dump
        run: |
          docker compose exec -T postgres pg_dump -U postgres -d UKRDC -Fc > ukrdc_database.dump

      - name: Commit initialized container to new image
        run: |
          docker commit ukrdc-postgres-build ghcr.io/${{ github.repository }}:initialized-temp

      - name: Extract metadata for initialized image
        id: meta-initialized
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-initialized
            type=semver,pattern={{major}}.{{minor}},suffix=-initialized
            type=semver,pattern={{major}},suffix=-initialized
            type=raw,value=initialized

      - name: Tag and push initialized image
        run: |
          for tag in ${{ steps.meta-initialized.outputs.tags }}; do
            docker tag ghcr.io/${{ github.repository }}:initialized-temp $tag
            docker push $tag
          done

      - name: Stop database container
        run: docker compose down

      - name: Attach dump to release
        uses: softprops/action-gh-release@v2
        with:
          files: ukrdc_database.dump