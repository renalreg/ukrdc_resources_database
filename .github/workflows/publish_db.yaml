name: Build and publish UKRDC database

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start database container
        run: |
          docker compose up -d --build

      - name: Create PostgreSQL dump
        run: |
          docker compose exec -T postgres pg_dump -U postgres -d UKRDC -Fc > ukrdc_database.dump

      - name: Attach dump to release
        uses: softprops/action-gh-release@v2
        with:
          files: ukrdc_database.dump

      - name: Commit and tag running container
        run: |
          docker commit ukrdc-postgres ghcr.io/${{ github.repository }}:initialized
          docker tag ghcr.io/${{ github.repository }}:initialized ghcr.io/${{ github.repository }}:latest

      - name: Push to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push ghcr.io/${{ github.repository }}:initialized
          docker push ghcr.io/${{ github.repository }}:latest
